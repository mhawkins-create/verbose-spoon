name: Build TapDucky Launcher APK

on:
  push:
    branches:
      - main
      - build/tapducky-launcher-20260829
    paths-ignore:
      - tapducky-build-artifacts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tapducky-simple-launcher

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/aapt-badging.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Persist build artifact for retrieval
        run: |
          mkdir -p ../tapducky-build-artifacts
          base64 -w0 app/build/outputs/apk/debug/app-debug.apk > ../tapducky-build-artifacts/app-debug.apk.b64
          cp app/build/outputs/apk/debug/app-debug.apk.sha256 ../tapducky-build-artifacts/
          cp app/build/outputs/apk/debug/aapt-badging.txt ../tapducky-build-artifacts/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tapducky-build-artifacts
          git commit -m "build: persist TapDucky launcher APK [skip ci]"
          git push
